<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figure review — vic-mq</title>
<style>
 :root{--ink:#0D1117;--line:#d8dee6;--flag:#c0392b;--ok:#1e7a3c}
 *{box-sizing:border-box}
 body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#eef1f5;color:var(--ink)}
 header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);
   padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
 header b{font-size:15px} .sp{flex:1}
 button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:#fff;
   border-radius:6px;cursor:pointer}
 button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
 #count{font-variant-numeric:tabular-nums}
 select,input[type=search]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
 main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:16px}
 .card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
   display:flex;flex-direction:column}
 .card.flagged{border-color:var(--flag);box-shadow:0 0 0 2px rgba(192,57,43,.18)}
 .card.done{opacity:.5}
 .hd{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);
   background:#fafbfc}
 .n{background:var(--ink);color:#fff;border-radius:6px;padding:2px 9px;font-weight:700;
   font-variant-numeric:tabular-nums}
 .meta{font-size:11.5px;color:#667}
 .fig{padding:14px;text-align:center;color:var(--ink);background:#fff}
 .fig svg{max-width:100%;height:auto}
 .stem{padding:10px 12px;border-top:1px solid var(--line);font-size:13px}
 .opts{padding:0 12px 10px;font-size:12.5px;color:#445}
 .opts b{color:var(--ok)}
 .note{width:100%;border:0;border-top:1px solid var(--line);padding:7px 12px;font:inherit;
   font-size:12.5px;display:none}
 .card.flagged .note{display:block;background:#fff8f7}
 .acts{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
 .acts button{flex:1;font-size:12.5px}
 dialog{border:1px solid var(--line);border-radius:10px;padding:16px;max-width:640px;width:90%}
 textarea{width:100%;height:220px;font:12.5px/1.5 ui-monospace,monospace;border:1px solid var(--line);
   border-radius:6px;padding:8px}
</style>
<header>
 <b>Figure review — vic-mq</b>
 <span id="count"></span>
 <span class="sp"></span>
 <select id="filter">
   <option value="all">show all</option>
   <option value="todo">not yet looked at</option>
   <option value="flagged">flagged only</option>
 </select>
 <input type="search" id="find" placeholder="filter by book or text">
 <button id="copy" class="primary">Copy flagged list</button>
 <button id="reset">Clear my marks</button>
</header>
<main id="grid"></main>
<dialog id="out"><h3 style="margin:0 0 8px">Paste this back</h3>
 <textarea id="outtext" readonly></textarea>
 <div style="margin-top:10px;text-align:right"><button onclick="out.close()">Close</button></div>
</dialog>
<script>
const DATA = [{"n": 1, "id": "5bad3ba8-7ee2-4e0f-ad55-25db8a46ce8b", "book": "external_qr_300526", "form": "", "stem": "A circle in the standard (x, y) coordinate plane is tangent to the x-axis at 6 and tangent to the y-axis at 6. Which of the following is an equation of the circle?", "a": "(x − 6)² + (y − 6)² = 36", "b": "(x − 6)² + (y + 6)² = 36", "c": "x² + y² = 6", "d": "x² + y² = 36", "key": "A", "svg": "<svg width=\"200\" height=\"200\" viewBox=\"-10 -10 200 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,sans-serif\">\n  <!-- axes -->\n  <line x1=\"-5\" y1=\"90\" x2=\"185\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <line x1=\"90\" y1=\"-5\" x2=\"90\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"1\"/>\n  <!-- axis arrows -->\n  <polygon points=\"185,87 178,90 185,93\" fill=\"currentColor\"/>\n  <polygon points=\"87,-5 90,2 93,-5\" fill=\"currentColor\"/>\n  <text x=\"188\" y=\"94\" font-size=\"11\" fill=\"currentColor\">x</text>\n  <text x=\"86\" y=\"-7\" font-size=\"11\" fill=\"currentColor\">y</text>\n  <!-- grid ticks -->\n  <line x1=\"90\" y1=\"90\" x2=\"90\" y2=\"90\"/>\n  <text x=\"87\" y=\"105\" font-size=\"10\" fill=\"currentColor\">0</text>\n  <text x=\"145\" y=\"105\" font-size=\"10\" fill=\"currentColor\">6</text>\n  <text x=\"78\" y=\"37\" font-size=\"10\" fill=\"currentColor\">6</text>\n  <!-- circle centred at (6,6) radius 6 — scaled: 1 unit = ~9px, origin at (90,90) -->\n  <!-- centre at pixel (90+54, 90-54) = (144,36) radius 54 -->\n  <circle cx=\"144\" cy=\"36\" r=\"54\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\" fill-opacity=\"0.5\" stroke-opacity=\".85\"/>\n  <!-- tangent lines (axes) highlighted -->\n  <line x1=\"90\" y1=\"-5\" x2=\"90\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3,2\" stroke-opacity=\".85\"/>\n  <line x1=\"-5\" y1=\"90\" x2=\"185\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3,2\" stroke-opacity=\".85\"/>\n ls (0,20,40,60,80) — scale: 80 students = 100px, 1 student = 1.25px -->\n  <line x1=\"40\" y1=\"145\" x2=\"245\" y2=\"145\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-opacity=\".28\"/>\n  <line x1=\"40\" y1=\"120\" x2=\"245\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"0.5\" stroke-opacity=\".28\"/>\n  <line x1=\"40\" y1=\"95\"  x2=\"245\" y2=\"95\"  stroke=\"currentColor\" stroke-width=\"0.5\" stroke-opacity=\".28\"/>\n  <line x1=\"40\" y1=\"70\"  x2=\"245\" y2=\"70\"  stroke=\"currentColor\" stroke-width=\"0.5\" stroke-opacity=\".28\"/>\n  <line x1=\"40\" y1=\"45\"  x2=\"245\" y2=\"45\"  stroke=\"currentColor\" stroke-width=\"0.5\" stroke-opacity=\".28\"/>\n  <text x=\"35\" y=\"149\" text-anchor=\"end\" font-size=\"9\" fill=\"currentColor\">0</text>\n  <text x=\"35\" y=\"124\" text-anchor=\"end\" font-size=\"9\" fill=\"currentColor\">20</text>\n  <text x=\"35\" y=\"99\"  text-anchor=\"end\" font-size=\"9\" fill=\"currentColor\">40</text>\n  <text x=\"35\" y=\"74\"  text-anchor=\"end\" font-size=\"9\" fill=\"currentColor\">60</text>\n  <text x=\"35\" y=\"49\"  text-anchor=\"end\" font-size=\"9\" fill=\"currentColor\">80</text>\n  <!-- bars: Maths=70→87.5px, Science=45→56.25px, English=55→68.75px, History=30→37.5px, Art=65→81.25px -->\n  <rect x=\"50\"  y=\"57.5\"  width=\"28\" height=\"87.5\" fill=\"currentColor\" fill-opacity=\".18\"/>\n  <rect x=\"95\"  y=\"88.75\" width=\"28\" height=\"56.25\" fill=\"currentColor\" fill-opacity=\".18\"/>\n  <rect x=\"140\" y=\"76.25\" width=\"28\" height=\"68.75\" fill=\"currentColor\" fill-opacity=\".18\"/>\n  <rect x=\"185\" y=\"107.5\" width=\"28\" height=\"37.5\"  fill=\"currentColor\" fill-opacity=\".18\"/>\n  <rect x=\"228\" y=\"63.75\" width=\"28\" height=\"81.25\" fill=\"currentColor\" fill-opacity=\".18\"/>\n  <!-- x labels -->\n  <text x=\"64\"  y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">Maths</text>\n  <text x=\"109\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">Science</text>\n  <text x=\"154\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">English</text>\n  <text x=\"199\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">History</text>\n  <text x=\"242\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">Art</text>\n  <!-- y axis label -->\n  <text transform=\"rotate(-90)\" x=\"-90\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">Number of students</text>\n</svg>"}, {"n": 4, "id": "f7991dce-6987-4baf-8bdb-3d85ef8bc5a0", "book": "external_qr_300526", "form": "vic-drill-mq-021", "stem": "A square is circumscribed about a circle of radius 4 cm, as shown below. What is the area of the square, in square centimetres?", "a": "64", "b": "32", "c": "16", "d": "8", "key": "A", "svg": "<svg width=\"180\" height=\"180\" viewBox=\"0 0 180 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,sans-serif\">\n  <!-- square: side = 2*r = 8 units, scaled: 1 unit=16px, side=128px, start (26,26) -->\n  <rect x=\"26\" y=\"26\" width=\"128\" height=\"128\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.8\" fill-opacity=\".18\"/>\n  <!-- circle: centre (90,90) radius 64 -->\n  <circle cx=\"90\" cy=\"90\" r=\"64\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\" fill-opacity=\"0.6\" stroke-opacity=\".85\"/>\n  <!-- radius line -->\n  <line x1=\"90\" y1=\"90\" x2=\"154\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-opacity=\".85\"/>\n  <text x=\"120\" y=\"85\" font-size=\"11\" fill=\"currentColor\" fill-opacity=\"0.9\">4</text>\n  <!-- centre dot -->\n  <circle cx=\"90\" cy=\"90\" r=\"3\" fill=\"currentColor\" fill-opacity=\"0.9\"/>\n</svg>"}, {"n": 5, "id": "23bfa545-dd24-4d70-a071-a528b39e1594", "book": "external_qr_300526", "form": "vic-drill-mq-028", "stem": "In the figure below, ABCD is a trapezoid with BC parallel to AD. E lies on line AD, and angle measures are as marked. What is 3\"/><path d=\"M200.0 110.0A20.0 20.0 0 0 1 211.1 92.1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></svg>"}, {"n": 6, "id": "18cbc3e4-26ca-49f1-a7d2-835481301a54", "book": "external_qr_300526", "form": "vic-drill-mq-058", "stem": "Hexagons have 9 diagonals, as illustrated below. How many diagonals does an octagon (8 sides) have?", "a": "24", "b": "18", "c": "20", "d": "16", "key": "C", "svg": "<svg width=\"280\" height=\"140\" viewBox=\"0 0 280 140\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,sans-serif\">\n  <!-- HEXAGON centred at (70,70) radius 55 -->\n  <polygon points=\"70,15 117.7,42.5 117.7,97.5 70,125 22.3,97.5 22.3,42.5\"\n    fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.8\" fill-opacity=\".18\"/>\n  <!-- All 9 diagonals of hexagon -->\n  <line x1=\"70\" y1=\"15\"  x2=\"117.7\" y2=\"97.5\" stroke=\"currentColor\" stroke-width=\"0.8\"/>\n  <line x1=\"70\" y1=\"15\"  x2=\"70\"    y2=\"125\"  stroke=\"currentColor\" stroke-width=\"0.8\"/>\n  <line x1=\"70\" y1=\"15\"  x2=\"22.3\"  y2=\"97.5\" stroke=\"currentColor\" stroke-width=\"0.8\"/>\n  <line x1=\"117.7\" y1=\"42.5\" x2=\"70\"    y2=\"125\"  stroke=\"currentColor\" stroke-width=\"0.8\"/>\n  <line x1=\"117.7\" y1=\"42.5\" x2=\"22.3\"  y2=\"97.5\" stroke=\"currentColor\" stroke-width=\"0.8\"/>\n  <line x1=\"117.7\" y1=\"42.5\" x2=\"22.3\"  y2=\"42.5\" stroke=\"currentColor\" stroke-width=\"0.8\"/>\n  <line x1=\"117.7\" y1=\"97.5\" x2=\"22.3\"  y2=\"42.5\" stroke=\"currentColor\" stroke-width=\"0.8\"/>\n  <line x1=\"70\"    y1=\"125\"  x2=\"22.3\"  y2=\"42.5\" stroke=\"currentColor\" stroke-width=\"0.8\"/>\n  <line x1=\"117.7\" y1=\"97.5\" x2=\"22.3\"  y2=\"97.5\" stroke=\"currentColor\" stroke-width=\"0.8\"/>\n  <text x=\"70\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">Hexagon (9 diagonals)</text>\n  <!-- OCTAGON centred at (210,70) radius 52 -->\n  <polygon points=\"210,18 246.8,37.2 262.8,73.0 246.8,108.8 210,128 173.2,108.8 15 98\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a1a2a\">Total area = 270 m²</text>\n</svg>"}, {"n": 107, "id": "a30aed4e-8a2d-40be-8aad-0a84dc3043d4", "book": "png_act_test4_230526", "form": "vic-drill-mq-014", "stem": "The graph below shows two straight lines. At what point do the lines x = 3 and y = x + 2 intersect?", "a": "(2, 3)", "b": "(5, 3)", "c": "(3, 2)", "d": "(3, 5)", "key": "D", "svg": "<svg width='280' height='220' viewBox='0 0 280 220' xmlns='http://www.w3.org/2000/svg'><rect width='280' height='220' fill='none'/><line x1='30' y1='200' x2='270' y2='200' stroke='currentColor' stroke-width='1.5'/><line x1='30' y1='200' x2='270' y2='200' stroke='currentColor' stroke-width='1.5'/><line x1='40' y1='210' x2='40' y2='10' stroke='currentColor' stroke-width='1.5'/><polygon points='270,200 262,196 262,204' fill='currentColor'/><polygon points='40,10 36,18 44,18' fill='currentColor'/><text x='272' y='204' font-size='11' fill='currentColor' font-family='Arial'>x</text><text x='44' y='10' font-size='11' fill='currentColor' font-family='Arial'>y</text><line x1='40' y1='200' x2='40' y2='200' stroke='none'/><text x='33' y='214' font-size='10' fill='currentColor' font-family='Arial'>0</text><line x1='160' y1='10' x2='160' y2='210' stroke='currentColor' stroke-width='2' stroke-dasharray='5,3' stroke-opacity=\".85\"/><text x='163' y='22' font-size='11' fill='currentColor' font-family='Arial' fill-opacity=\"0.9\">x=3</text><line x1='40' y1='180' x2='250' y2='40' stroke='currentColor' stroke-width='2' stroke-opacity=\".85\"/><text x='218' y='35' font-size='11' fill='currentColor' font-family='Arial' fill-opacity=\"0.9\">y=x+2</text><circle cx='160' cy='115' r='4' fill='currentColor'/><text x='165' y='110' font-size='10' fill='currentColor' font-family='Arial'>(3,5)</text><line x1='80' y1='200' x2='84' y2='200' stroke='currentColor' stroke-width='1'/><text x='78' y='213' font-size='9' fill='currentColor' font-family='Arial'>1</text><line x1='120' y1='200' x2='124' y2= =\"11\" text-anchor=\"middle\" fill=\"#1a1a2a\">3 m</text>\n  <!-- Label -->\n  <text x=\"95\" y=\"130\" font-size=\"13\" fill=\"#1a1a2a\" text-anchor=\"middle\">Room</text>\n  <text x=\"201\" y=\"52\" font-size=\"11\" fill=\"#888\" text-anchor=\"middle\">Alcove</text>\n</svg>"}, {"n": 123, "id": "a6e5c362-9398-4607-abb3-9327572aad2f", "book": "png_act_test5_230526", "form": "vic-drill-mq-012", "stem": "In the figure below, two tangent circles are shown. The 10 cm diameter of the smaller circle equals the radius of the larger circle. What is the approximate area, in square centimetres, of the shaded region (inside the large circle but outside the small circle)? Use π ≈ 3.14.", "a": "314.0", "b": "392.5", "c": "235.5", "d": "78.5", "key": "C", "svg": "<svg width=\"280\" height=\"230\" viewBox=\"0 0 280 230\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"280\" height=\"230\" fill=\"none\"/><circle cx=\"140\" cy=\"135\" r=\"90\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" fill-opacity=\".18\"/><circle cx=\"140\" cy=\"80\" r=\"45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"140\" y1=\"35\" x2=\"140\" y2=\"125\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/><text x=\"145\" y=\"85\" font-size=\"13\" font-family=\"Arial\" fill=\"currentColor\">10</text><text x=\"108\" y=\"185\" font-size=\"12\" font-family=\"Arial\" fill=\"currentColor\">Shaded</text></svg>"}, {"n": 124, "id": "ceea0f80-b3e8-4d08-bb36-990da0d033ab", "book": "png_act_test5_230526", "form": "vic-drill-mq-018", "stem": "In the figure below, ABCD is a square with side length 12 cm. Points P, Q, R, and S are the midpoints of sides AB, BC, CD, and DA respectively. What is the area of quadrilateral PQRS in cm²?", "a": "36", "b": "48", "c": "72", "d": "60", "key": "C", "svg": "<svg width='260' height='260' viewBox='0 0 260 260' xmlns='http://www.w3.org/2000/svg'><rect width='260' height='260' fill='none'/><rect x='50' y='50' width='160' h  y1=\"190\" x2=\"230\" y2=\"190\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <!-- Tick marks for equal sides PQ and QR -->\n  <line x1=\"88\" y1=\"106\" x2=\"98\" y2=\"118\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <line x1=\"182\" y1=\"106\" x2=\"192\" y2=\"118\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <!-- Labels -->\n  <text x=\"140\" y=\"18\" font-size=\"14\" font-family=\"Arial\" text-anchor=\"middle\" fill=\"#1a1a2a\">Q</text>\n  <text x=\"34\" y=\"200\" font-size=\"14\" font-family=\"Arial\" text-anchor=\"middle\" fill=\"#1a1a2a\">P</text>\n  <text x=\"244\" y=\"200\" font-size=\"14\" font-family=\"Arial\" text-anchor=\"middle\" fill=\"#1a1a2a\">R</text>\n  <!-- Angle Q label -->\n  <text x=\"140.0\" y=\"71.6\" font-size=\"12\" font-family=\"Arial\" text-anchor=\"middle\" fill=\"#1a1a2a\">48°</text>\n<path d=\"M149.8 47.4A20.0 20.0 0 0 1 130.2 47.4\" fill=\"none\" stroke=\"#1a1a2a\" stroke-width=\"1.3\"/></svg>"}, {"n": 205, "id": "1a938fec-77cb-4425-bf1a-5c2889588551", "book": "png_act_test7_240526", "form": "vic-drill-mq-062", "stem": "The graph shows the number of tourists (in thousands) who visited four Australian cities during a particular month. How many more tourists visited Sydney than Adelaide?", "a": "30 000", "b": "25 000", "c": "20 000", "d": "15 000", "key": "B", "svg": "<svg width=\"300\" height=\"220\" viewBox=\"0 0 300 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:white\">\n  <!-- Axes -->\n  <line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"180\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <line x1=\"50\" y1=\"180\" x2=\"290\" y2=\"180\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <!-- Y axis label -->\n  <text x=\"14\" y=\"100\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"middle\" fill=\"#1a1a2a\" transform=\"rotate(-90,14,100)\">Tourists (thousands)</text>\n  <!-- Y ticks and labels: 0,10,20,30,40,50,60 → scale: 170px for 60000, so 1000 = 170/60 px -->\n  <!-- 0 at y=180, 10 at y=152, 20 at y=124, 30 at y=96, 40 at y=68, 50 at y=40, 60 at y=12 -->\n  <line x1=\"46\" y1=\"180\" x2=\"50\" y2=\"180\" stroke=\"#1a1a2a\" stroke-width=\"1\"/>\n  <text x=\"40\" y=\"184\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"end\" fill=\"#1a1a2a\">0</text>\n  <line x1=\"46\" y1=\"152\" x2=\"50\" y2=\"152\" stroke=\"#1a1a2a\" stroke-width=\"1\"/>\n  <text x=\"40\" y=\"156\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"end\" fill=\"#1a1a2a\">10</text>\n  <line x1=\"46\" y1=\"124\" x2=\"50\" y2=\"124\" stroke=\"#1a1a2a\" stroke-width=\"1\"/>\n  <text x=\"40\" y=\"128\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"end\" fill=\"#1a1a2a\">20</text>\n  <line x1=\"46\" y1=\"96\" x2=\"50\" y2=\"96\" stroke=\"#1a1a2a\" stroke-width=\"1\"/>\n  <text x=\"40\" y=\"100\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"end\" fill=\"#1a1a2a\">30</text>\n  <line x1=\"46\" y1=\"68\" x2=\"50\" y2=\"68\" stroke=\"#1a1a2a\" stroke-width=\"1\"/>\n  <text x=\"40\" y=\"72\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"end\" fill=\"#1a1a2a\">40</text>\n  <line x1=\"46\" y1=\"40\" x2=\"50\" y2=\"40\" stroke=\"#1a1a2a\" stroke-width=\"1\"/>\n  <text x=\"40\" y=\"44\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"end\" fill=\"#1a1a2a\">50</text>\n  <line x1=\"46\" y1=\"12\" x2=\"50\" y2=\"12\" stroke=\"#1a1a2a\" stroke-width=\"1\"/>\n  <text x=\"40\" y=\"16\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"end\" fill=\"#1a1a2a\">60</text>\n  <!-- Bars: Sydney=55→y=180-55*2.833=180-155.8=24, Melbourne=45→y=52, Brisbane=38→y=72, Adelaide=30→y=96 -->\n  <!-- Sydney bar: height = 55*(170/60)=155.8, top y = 180-155.8=24.2 -->\n  <rect x=\"60\" y=\"24\" width=\"40\" height=\"156\" fill=\"#4a90d9\"/>\n  <text x=\"80\" y=\"196\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"middle\" fill=\"#1a1a2a\">Sydney</text>\n  <!-- Melbourne bar: 45*(170/60)=127.5, top=52.5 -->\n  <rect x=\"115\" y=\"53\" width=\"40\" height=\"127\" fill=\"#4a90d9\"/>\n  <text x=\"135\" y=\"196\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"middle\" fill=\"#1a1a2a\">Melb.</text>\n  <!-- Brisbane bar: 38*(170/60)=107.7, top=72.3 -->\n  <rect x=\"170\" y=\"72\" width=\"40\" height=\"108\" fill=\"#4a90d9\"/>\n  <text x=\"190\" y=\"196\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"middle\" fill=\"#1a1a2a\">Brisb.</text>\n  <!-- Adelaide bar: 30*(170/60)=85, top=95 -->\n  <rect x=\"225\" y=\"95\" width=\"40\" height=\"85\" fill=\"#4a90d9\"/>\n  <text x=\"245\" y=\"196\" font-size=\"10\" font-family=\"Arial\" text-anchor=\"middle\" fill=\"#1a1a2a\">Adel.</text>\n</svg>"}, {"n": 206, "id": "69956c3d-ffb0-4bdf-85ff-82ac7d1e6bd5", "book": "png_act_test7_240526", "form": "vic-drill-mq-064", "stem": "In the figure below, the exterior angle of a triangle at vertex C is marked 132°. The two non-adjacent interior angles are marked x° and (x + 18)°. What is the value of x?", "a": "63", "b": "51", "c": "66", "d": "57", "key": "D", "svg": "<svg width='300' height='200' viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg' style='background:white'><polygon points='50,170 250,170 150,50' fill='none' stroke='#1a1a2a' stroke-width='2'/><line x1='250' y1='170' x2='290' y2='170' stroke='#1a1a2a' stroke-width='2'/><text x='36' y='188' font-size='13' fill='#1a1a2a'>A</text><text x='252' y='188' font-size='13' fill='#1a1a2a'>B</text><text x='144' y='42' font-size='13' fill='#1a1a2a'>C</text><text x=\"80.3\" y=\"156.1\" font-size='13' fill='#1a1a2a'>x°</text><text x=\"173.8\" y=\"149.6\" font-size='13' fill='#1a1a2a'>(x+18)°</text><text x='256' y='162' font-size='13' fill='#1a1a2a'>132°</text><path d=\"M62.8 154.6A20.0 20.0 0 0 1 70.0 170.0\" fill=\"none\" stroke=\"#1a1a2a\" stroke-width=\"1.3\"/><path d=\"M230.0 170.0A20.0 20.0 0 0 1 237.2 154.6\" fill=\"none\" stroke=\"#1a1a2a\" stroke-width=\"1.3\"/></svg>"}, {"n": 207, "id": "b07bdd43-0525-4792-8b3c-53ddf9196548", "book": "png_act_test7_240526", "form": "vic-drill-mq-067", "stem": "In the figure below, ABCD is a trapezoi \" x2=\"270\" y2=\"165\" stroke=\"#1a1a2a\" stroke-width=\"1\"/>\n  <polygon points=\"30,165 36,162 36,168\" fill=\"#1a1a2a\"/>\n  <polygon points=\"270,165 264,162 264,168\" fill=\"#1a1a2a\"/>\n  <text x=\"150\" y=\"180\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1a1a2a\">16 cm</text>\n  <!-- Left width arrow -->\n  <line x1=\"30\" y1=\"155\" x2=\"120\" y2=\"155\" stroke=\"#1a1a2a\" stroke-width=\"1\"/>\n  <polygon points=\"30,155 36,152 36,158\" fill=\"#1a1a2a\"/>\n  <polygon points=\"120,155 114,152 114,158\" fill=\"#1a1a2a\"/>\n  <text x=\"75\" y=\"148\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1a1a2a\">6 cm</text>\n</svg>"}, {"n": 247, "id": "205430e5-43dd-462b-9195-6ee48c10a975", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-017", "stem": "In the figure below, a rectangular paddock in regional Victoria has a fence post at each corner. The length of the paddock is 3 times its width. If the total perimeter of the paddock is 96 metres, what is the area of the paddock in square metres?", "a": "576 m²", "b": "540 m²", "c": "504 m²", "d": "432 m²", "key": "D", "svg": "<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"300\" height=\"200\" fill=\"none\"/><rect x=\"40\" y=\"50\" width=\"220\" height=\"100\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" fill-opacity=\".18\"/><circle cx=\"40\" cy=\"50\" r=\"4\" fill=\"currentColor\"/><circle cx=\"260\" cy=\"50\" r=\"4\" fill=\"currentColor\"/><circle cx=\"40\" cy=\"150\" r=\"4\" fill=\"currentColor\"/><circle cx=\"260\" cy=\"150\" r=\"4\" fill=\"currentColor\"/><text x=\"26\" y=\"44\" font-size=\"12\" fill=\"currentColor\" font-weight=\"bold\">A</text><text x=\"264\" y=\"44\" font-size=\"12\" fill=\"currentColor\" font-weight=\"bold\">B</text><text x=\"26\" y=\"164\" font-size=\"12\" fill=\"currentColor\" font-weight=\"bold\">D</text><text x=\"264\" y=\"164\" font-size=\"12\" fill=\"currentColor\" font-weight=\"bold\">C</text ill='#1a1a2a'>0.15</text><text x='246' y='85' text-anchor='middle' font-size='12' font-family='Arial' fill='#1a1a2a'>0.10</text></svg>"}, {"n": 253, "id": "7a25fb4e-5548-425e-9a1d-cc8beb860276", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-022", "stem": "The figure below shows a rectangle ABCD with a triangle cut from one corner. The shaded region is the remaining shape. What is the area of the shaded region?", "a": "48 cm²", "b": "54 cm²", "c": "60 cm²", "d": "66 cm²", "key": "B", "svg": "<svg width=\"300\" height=\"220\" viewBox=\"0 0 300 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:white\">\n  <!-- Rectangle ABCD: A=(30,20), B=(210,20), C=(210,180), D=(30,180) -->\n  <!-- Scale: 9 units wide = 180px → 20px/unit, 8 units tall = 160px → 20px/unit -->\n  <!-- Cut triangle from top-right corner B=(210,20): legs 6 units each = 120px -->\n  <!-- Triangle vertices: B=(210,20), E=(90,20), F=(210,140) -->\n  <!-- Shaded polygon: A=(30,20), E=(90,20), F=(210,140), C=(210,180), D=(30,180) -->\n  <polygon points=\"30,20 90,20 210,140 210,180 30,180\" fill=\"#b0d4f1\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <!-- Dashed lines showing original rectangle -->\n  <line x1=\"90\" y1=\"20\" x2=\"210\" y2=\"20\" stroke=\"#1a1a2a\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <line x1=\"210\" y1=\"20\" x2=\"210\" y2=\"140\" stroke=\"#1a1a2a\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <!-- Hypotenuse of cut triangle -->\n  <line x1=\"90\" y1=\"20\" x2=\"210\" y2=\"140\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <!-- Labels -->\n  <text x=\"16\" y=\"18\" font-size=\"12\" fill=\"#1a1a2a\" font-weight=\"bold\">A</text>\n  <text x=\"214\" y=\"18\" font-size=\"12\" fill=\"#1a1a2a\" font-weight=\"bold\">B</text>\n  <text x=\"214\" y=\"186\" font-size=\"12\" fill=\"#1a1a2a\" font-weight=\"bold\">C</text>\n  <text x=\"16\" y=\"186\" font-size=\"12\" fill=\"#1a1a2a\" font-weight=\"bold\">D</text>\n  <!-- Dimension labels -->\n  <!-- Width AD = 9 cm, bottom -->\n  <text x=\"120\" y=\"198\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1a1a2a\">9 cm</text>\n  <!-- Height AB = 8 cm, left side -->\n  <text x=\"14\" y=\"104\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1a1a2a\" transform=\"rotate(-90,14,104)\">8 cm</text>\n  <!-- Cut triangle legs = 6 cm each -->\n  <text x=\"148\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" fill=\"#555\">6 cm</text>\n  <text x=\"220\" y=\"84\" text-anchor=\"start\" font-size=\"11\" fill=\"#555\">6 cm</text>\n</svg>"}, {"n": 254, "id": "4d8c6127-0cbe-400a-821c-2815f8d7ecbf", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-022", "stem": "In the figure below, a large rectangle has a width of 15 cm and a height of 6 cm. A rectangular section 5 cm wide and 2 cm tall is removed from the top-middle of the rectangle, leaving a shaded U-shape. What is the perimeter of the shaded shape?", "a": "52 cm", "b": "42 cm", "c": "48 cm", "d": "46 cm", "key": "D", "svg": "<svg width=\"300\" height=\"200\" viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"300\" height=\"200\" fill=\"none\"/><polygon points=\"30,40 270,40 270,160 30,160 30,40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><polygon points=\"30,40 115,40 115,80 185,80 185,40 270,40 270,160 30,160\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" fill-opacity=\".18\"/><text x=\"150\" y=\"175\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">15 cm</text><text x=\"14\" y=\"102\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\">6 cm</text><text x=\"150\" y=\"36\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">5 cm</text><text x=\"193\" y=\"63\" text-anchor=\"start\" font-size=\"12\" fill=\"currentColor\">2 cm</text><line x1=\"30\" y1=\"168\" x2=\"270\" y2=\"168\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"150\" y=\"179\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\"></text></svg>"}, {"n": 255, "id": "48fb8741-3074-448b-9a66-08941e4051a8", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-023", "stem": "In the figure below, a large rectangle has been divided into four smaller rectangles by one horizontal and one vertical line. Three of the four areas are given. What is the area of the shaded region?", "a": "15 cm²", "b": "20 cm²", "c": "18 cm²", "d": "12 cm²", "key": "A", "svg": "<svg width=\"280\" height=\"220\" viewBox=\"0 0 280 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:white\">\n  <!-- Outer rectangle: x=30,y=30, width=220, height=160 -->\n  <!-- Vertical divider at x=30+88=118 (ratio 12:18 → 2:3, so left=2/5*220=88) -->\n  <!-- Horizontal divider at y=30+100=130 (ratio 12:10 → 6:5, so top=6/11*160≈87.3, use 87) -->\n  <!-- Top-left: x=30,y=30,w=88,h=87 area=12*p... let me just use fixed pixel positions and label areas -->\n  <!-- Let left width col=88px, right width col=132px; top height=87px, bottom height=73px -->\n  <rect x=\"30\" y=\"30\" width=\"88\" height=\"87\" fill=\"#e8e8f0\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <text x=\"74\" y=\"78\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1a1a2a\">12 cm²</text>\n  <rect x=\"118\" y=\"30\" width=\"132\" height=\"87\" fill=\"white\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <text x=\"184\" y=\"78\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1a1a2a\">18 cm²</text>\n  <rect x=\"30\" y=\"117\" width=\"88\" height=\"73\" fill=\"white\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <text x=\"74\" y=\"158\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1a1a2a\">10 cm²</text>\n  <rect x=\"118\" y=\"117\" width=\"132\" height=\"73\" fill=\"#b0c4de\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <text x=\"184\" y=\"158\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1a1a2a\">?</text>\n  <text x=\"150\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\">shaded region</text>\n</svg>"}, {"n": 256, "id": "9927de80-e684-4245-9ea2-7d9c236af433", "book": "png_shs  figure below shows a row of 8 tiles — some white and some grey. Jasper wants the finished row to have exactly one vertical line of symmetry by adding tiles ONLY to the right end. The current row (left to right) is: White, Grey, White, Grey, Grey, White, Grey, White. How many tiles does Jasper need to add?", "a": "0", "b": "6", "c": "4", "d": "2", "key": "A", "svg": "<svg width=\"300\" height=\"80\" viewBox=\"0 0 300 80\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"300\" height=\"80\" fill=\"none\"/><rect x=\"5\" y=\"20\" width=\"34\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"41\" y=\"20\" width=\"34\" height=\"40\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"77\" y=\"20\" width=\"34\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"113\" y=\"20\" width=\"34\" height=\"40\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"149\" y=\"20\" width=\"34\" height=\"40\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"185\" y=\"20\" width=\"34\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"221\" y=\"20\" width=\"34\" height=\"40\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"257\" y=\"20\" width=\"34\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>"}, {"n": 269, "id": "4574a519-1146-434e-ae50-123ccf691608", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-037", "stem": "In the figure below, a cylindrical water tank has a base radius of 0.5 m and a height of 2 m. Water is filled to 75% of its capacity. Using π ≈ 3.14, approximately how many litres of water are in the tank? (1 m³ = 1000 L)", "a": "785 L", "b": "1178 L", "c": "1570 L", "d": "589 L", "key": "B", "svg": "<svg width='280' height='230' viewBox='0 0 280 230' xmlns='http://www.w3.org/2000/svg' style='background:white'><ellipse cx='140' cy='190' rx='60' ry='15' fill='#b3d9f7' stroke='#1a1a2a' stroke-width='2'/><rect x='80' y='50' width='120' height='140' fill='#cce5ff' stroke='none'/><ellipse cx='140' cy='50' rx='60' ry='15' fill='#b3d9f7' stroke='#1a1a2a' stroke-width='2'/><line x1='80' y1='50' x2='80' y2='190' stroke='#1a1a2a' stroke-width='2'/><line x1='200' y1='50' x2='200' y2='190' stroke='#1a1a2a' stroke-width='2'/><rect x='80' y='85' width='120' height='105' fill='#4fc3f7' opacity='0.5'/><ellipse cx='140' cy='85' rx='60' ry='15' fill='#4fc3f7' stroke='#1565c0' stroke-width='1.5' opacity='0.8'/><text x='145' y='130' font-size='12' font-family='Arial' fill='#1a1a2a'>75%</text><line x1='210' y1='50' x2='240' y2='50' stroke='#1a1a2a' stroke-width='1'/><line x1='210' y1='190' x2='240' y2='190' stroke='#1a1a2a' stroke-width='1'/><line x1='228' y1='50' x2='228' y2='190' stroke='#1a1a2a' stroke-width='1.5'/><text x='245' y='125' font-size='11' font-family='Arial' fill='#1a1a2a'>2 m</text><line x1='80' y1='210' x2='200' y2='210' stroke='#1a1a2a' stroke-width='1.5'/><text x='130' y='224' font-size='11' font-family='Arial' fill='#1a1a2a' text-anchor='middle'>r = 0.5 m</text></svg>"}, {"n": 270, "id": "98884668-2d2c-4979-801d-cd540eed7ec4", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-038", "stem": "In the figure below, a shaded shape is formed by removing a rectangle from the top-right corner of a larger rectangle. The large rectangle is 13 cm wide and 8 cm tall. The removed rectangle is 4 cm wide and 3 cm tall. What is the perimeter of the shaded shape?", "a": "42 cm", "b": "40 cm", "c": "36 cm", "d": "44 cm", "key": "A", "svg": "<svg width=\"300\" height=\"210\" viewBox=\"0 0 300 210\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"300\" height=\"210\" fill=\"none\"/><polygon points=\"40,30 220,30 220,80 260,80 260,180 40,180\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" fill-opacity=\".18\"/><rect x=\"220\" y=\"30\" width=\"40\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><text x=\"150\" y=\"195\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">13 cm</text><text x=\"14\" y=\"108\" text-anchor=\"end\" font-size=\"13\" fill=\"currentColor\">8 cm</text><text x=\"240\" y=\"24\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">4 cm</text><text x=\"272\" y=\"57\" text-anchor=\"start\" font-size=\"12\" fill=\"currentColor\">3 cm</text><line x1=\"40\" y1=\"188\" x2=\"260\" y2=\"188\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"32\" y1=\"30\" x2=\"32\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1\"/></svg>"}, {"n": 271, "id": "82f15e67-a6d9-4b85-a67b-7b8b3d66457e", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-039", "stem": "The figure below shows a rectangle 8 cm wide and 5 cm tall. A right-angled triangle is cut from the top-right corner. The triangle has a base of 3 cm and a height of 2 cm (measured along the edges of the rectangle). What is the remaining area?", "a": "40 cm²", "b": "37 cm²", "c": "38 cm²", "d": "35 cm²", "key": "B", "svg": "<svg width='300' height='220' viewBox='0 0 300 220' xmlns='http://www.w3.org/2000/svg'><rect width='300' height='220' fill='none'/><polygon points='40,20 260,20 260,80 220,130 40,130' fill='currentColor' stroke='currentColor' stroke-width='2' fill-opacity=\".18\"/><line x1='220' y1='20' x2='260' y2='20' stroke='currentColor' stroke-width='1.5' stroke-dasharray='4,3'/><line x1='260' y1='20' x2='260' y2='80' stroke='currentColor' stroke-width='1.5' stroke-dasharray='4,3'/><rect x='243' y='63' width='14' height='14' fill='none' stroke='currentColor' stroke-width='1.5'/><text x='148' y='145' font-size='11' fill='currentColor' text-anchor='middle'>8 cm</text><text x='15' y='78' font-size='11' fill='currentColor'>5 cm</text><text x='232' y='14' font-size='10' fill='currentColor'>3 cm</text><text x='265' y='55' font-size='10' fill='currentColor'>2 cm</text><line x1='40' y1='145' x2='260' y2='145' str ' fill='#f8d0b8' fill-opacity='0.5' stroke='#1a1a2a' stroke-width='2'/><text x='90' y='80' text-anchor='middle' font-size='11' font-family='Arial' fill='#1a1a2a' font-weight='bold'>A</text><text x='218' y='80' text-anchor='middle' font-size='11' font-family='Arial' fill='#1a1a2a' font-weight='bold'>B</text><text x='90' y='118' text-anchor='middle' font-size='14' font-family='Arial' fill='#1a1a2a' font-weight='bold'>12</text><text x='152' y='118' text-anchor='middle' font-size='14' font-family='Arial' fill='#1a1a2a' font-weight='bold'>8</text><text x='214' y='118' text-anchor='middle' font-size='14' font-family='Arial' fill='#1a1a2a' font-weight='bold'>14</text><text x='88' y='60' text-anchor='middle' font-size='10' font-family='Arial' fill='#1a1a2a'>French</text><text x='215' y='60' text-anchor='middle' font-size='10' font-family='Arial' fill='#1a1a2a'>Japanese</text><text x='255' y='185' text-anchor='middle' font-size='13' font-family='Arial' fill='#1a1a2a'>?</text></svg>"}, {"n": 278, "id": "d7a4550b-05af-452a-996c-d4f46691d758", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-050", "stem": "In the figure below, a rectangular paddock in regional Victoria has length 3 times its width. If the total perimeter of the paddock is 96 metres, what is the area of the paddock?", "a": "648 m²", "b": "432 m²", "c": "576 m²", "d": "504 m²", "key": "B", "svg": "<svg width=\"300\" height=\"180\" viewBox=\"0 0 300 180\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"300\" height=\"180\" fill=\"none\"/><rect x=\"40\" y=\"40\" width=\"220\" height=\"90\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2\" fill-opacity=\".18\"/><circle cx=\"40\" cy=\"40\" r=\"3.5\" fill=\"currentColor\"/><circle cx=\"260\" cy=\"40\" r=\"3.5\" fill=\"currentColor\"/><circle cx=\"40\" cy=\"130\" r=\"3.5\" fill=\"currentColor\"/><circle cx=\"260\" cy=\"130\" r=\"3.5\" fill=\"currentColor\"/><text x=\"25\" y=\"34\" font-size=\"12\" fill=\"currentColor\" font-weight=\"bold\">A</text> ke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <!-- Dashed outline of original square -->\n  <rect x=\"40\" y=\"20\" width=\"180\" height=\"180\" fill=\"none\" stroke=\"#1a1a2a\" stroke-width=\"1.5\" stroke-dasharray=\"6,4\"/>\n  <!-- Cut triangle indicators -->\n  <polygon points=\"40,20 94,20 40,92\" fill=\"white\" stroke=\"#1a1a2a\" stroke-width=\"1.5\"/>\n  <polygon points=\"220,20 166,20 220,92\" fill=\"white\" stroke=\"#1a1a2a\" stroke-width=\"1.5\"/>\n  <polygon points=\"220,200 166,200 220,128\" fill=\"white\" stroke=\"#1a1a2a\" stroke-width=\"1.5\"/>\n  <polygon points=\"40,200 94,200 40,128\" fill=\"white\" stroke=\"#1a1a2a\" stroke-width=\"1.5\"/>\n  <!-- Side label: 10 cm -->\n  <text x=\"130\" y=\"215\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1a1a2a\">10 cm</text>\n  <!-- Leg labels on top-left triangle -->\n  <text x=\"66\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" fill=\"#555\">3 cm</text>\n  <text x=\"26\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" fill=\"#555\">4 cm</text>\n</svg>"}, {"n": 281, "id": "304158b1-2f46-4901-8f28-d6292cc1999b", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-055", "stem": "The bar chart below shows the number of meat pies sold at four different AFL venues in Melbourne on a Saturday. How many more pies were sold at the MCG than at GMHBA Stadium?", "a": "400", "b": "350", "c": "450", "d": "500", "key": "C", "svg": "<svg width=\"300\" height=\"220\" viewBox=\"0 0 300 220\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"300\" height=\"220\" fill=\"none\"/><line x1=\"55\" y1=\"10\" x2=\"55\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"55\" y1=\"175\" x2=\"290\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"50\" y1=\"175\" x2=\"55\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"50\" y1=\"140\" x2=\"55\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"1\"/><line x1=\"50\" y1=\"105\" x2=\"55\" y2=\"105\" stroke=\"currentColor\" stroke-width= =\"end\" font-size=\"12\" fill=\"currentColor\">3 cm</text><text x=\"216\" y=\"24\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">4 cm</text><text x=\"252\" y=\"52\" text-anchor=\"start\" font-size=\"12\" fill=\"currentColor\">2 cm</text><line x1=\"60\" y1=\"175\" x2=\"236\" y2=\"175\" stroke=\"currentColor\" stroke-width=\"1\" marker-start=\"url(#arr)\" marker-end=\"url(#arr)\"/><line x1=\"242\" y1=\"30\" x2=\"242\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"1\"/></svg>"}, {"n": 283, "id": "7f58a61d-ae5a-42d6-83c1-8a98ce820527", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-056", "stem": "The bar chart below shows the number of students at Melbourne Academy who chose each sport as their favourite. How many more students chose swimming or tennis combined than chose football or cricket combined?", "a": "20", "b": "15", "c": "5", "d": "10", "key": "D", "svg": "<svg width=\"300\" height=\"220\" viewBox=\"0 0 300 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:white\">\n  <!-- Axes -->\n  <line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"170\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <line x1=\"50\" y1=\"170\" x2=\"290\" y2=\"170\" stroke=\"#1a1a2a\" stroke-width=\"2\"/>\n  <!-- Y-axis labels -->\n  <text x=\"40\" y=\"174\" text-anchor=\"end\" font-size=\"11\" fill=\"#1a1a2a\">0</text>\n  <text x=\"40\" y=\"140\" text-anchor=\"end\" font-size=\"11\" fill=\"#1a1a2a\">10</text>\n  <text x=\"40\" y=\"106\" text-anchor=\"end\" font-size=\"11\" fill=\"#1a1a2a\">20</text>\n  <text x=\"40\" y=\"72\" text-anchor=\"end\" font-size=\"11\" fill=\"#1a1a2a\">30</text>\n  <text x=\"40\" y=\"38\" text-anchor=\"end\" font-size=\"11\" fill=\"#1a1a2a\">40</text>\n  <!-- Grid lines -->\n  <line x1=\"50\" y1=\"140\" x2=\"290\" y2=\"140\" stroke=\"#cccccc\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"50\" y1=\"106\" x2=\"290\" y2=\"106\" stroke=\"#cccccc\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"50\" y1=\"72\" x2=\"290\ -opacity=\".85\"/><circle cx=\"140\" cy=\"130\" r=\"5\" fill=\"currentColor\"/></svg>"}, {"n": 288, "id": "b5d5ced8-ab6c-4aa0-b308-fe309cdb8e55", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-065", "stem": "In the figure below, rectangle ABCD has been divided into four smaller rectangles by two lines parallel to its sides. The areas of three of the smaller rectangles are shown. What is the area of the fourth rectangle (shaded)?", "a": "20 cm²", "b": "27 cm²", "c": "24 cm²", "d": "18 cm²", "key": "C", "svg": "<svg width=\"280\" height=\"200\" viewBox=\"0 0 280 200\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"280\" height=\"200\" fill=\"none\"/><rect x=\"30\" y=\"20\" width=\"220\" height=\"160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"30\" y1=\"80\" x2=\"250\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"140\" y1=\"20\" x2=\"140\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"140\" y=\"80\" width=\"110\" height=\"100\" fill=\"currentColor\" fill-opacity=\".18\"/><text x=\"82\" y=\"55\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">12 cm²</text><text x=\"193\" y=\"55\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">18 cm²</text><text x=\"82\" y=\"135\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">36 cm²</text><text x=\"193\" y=\"135\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">?</text><text x=\"14\" y=\"16\" font-size=\"12\" fill=\"currentColor\">A</text><text x=\"252\" y=\"16\" font-size=\"12\" fill=\"currentColor\">B</text><text x=\"252\" y=\"192\" font-size=\"12\" fill=\"currentColor\">C</text><text x=\"14\" y=\"192\" font-size=\"12\" fill=\"currentColor\">D</text></svg>"}, {"n": 289, "id": "d31910a9-d13f-43e4-aac8-09441762bd8c", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-069", "stem": "In the figure below, a sequence of black and white tiles forms a row. The pattern so far (left to right) is: White, Black, Black, White, Black, White. Priya wants to add the minimum number of tiles to the RIGHT so the finished row has a vertical line of symmetry. How many tiles must she add?", "a": "2", "b": "6", "c": "8", "d": "4", "key": "B", "svg": "<svg width=\"290\" height=\"80\" viewBox=\"0 0 290 80\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"290\" height=\"80\" fill=\"none\"/><rect x=\"10\" y=\"20\" width=\"38\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50\" y=\"20\" width=\"38\" height=\"40\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"90\" y=\"20\" width=\"38\" height=\"40\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"130\" y=\"20\" width=\"38\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"170\" y=\"20\" width=\"38\" height=\"40\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"210\" y=\"20\" width=\"38\" height=\"40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>"}, {"n": 290, "id": "197fac9b-8147-4d5a-b947-9ba5764655ca", "book": "png_shs_pt1_310526", "form": "vic-drill-mq-069", "stem": "The figure below shows a rectangular swimming pool in Sydney viewed from above. The pool is 25 m long and 10 m wide. A smaller wading pool is attached at one end, measuring 5 m by 4 m. What is the total surface area of both pools combined?", "a": "250 m²", "b": "270 m²", "c": "290 m²", "d": "300 m²", "key": "B", "svg": "<svg width='300' height='200' viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg' style='background:white'><rect x='30' y='50' width='200' height='80' fill='#b3d9f7' stroke='#1a1a2a' stroke-width='2'/><rect x='230' y='65' width='40' height='50' fill='#cce5ff' stroke='#1a1a2a' stroke-width='2'/><text x='130' y='95' font-size='13' font-family='Arial' fill='#1a1a2a' text-anchor='middle'>Main Pool</text><text x='250' y='93' font-size='10' font-family='Arial' fill='#1a1a /><circle cx=\"292.6\" cy=\"142\" r=\"4.2\" fill=\"currentColor\" stroke=\"none\"/></svg>"}, {"n": 349, "id": "e4cd775a-4be6-43f3-a46f-f8ea95f3964d", "book": "year9_maths", "form": "vic-drill-mq-087", "stem": "The two right-angled triangles shown are similar. What is x, and what is the ratio of the smaller triangle&#x27;s area to the larger one&#x27;s?", "a": "x = 12 cm, and the areas are in the ratio 8 : 27", "b": "x = 12 cm, and the areas are in the ratio 2 : 3", "c": "x = 11 cm, and the areas are in the ratio 4 : 9", "d": "x = 12 cm, and the areas are in the ratio 4 : 9", "key": "D", "svg": "<svg viewBox=\"0 0 344 190\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"><path d=\"M44 160L104.8 160L44 114.4Z\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><path d=\"M54 160v-10h-10\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"37\" y=\"141.2\" text-anchor=\"end\" font-size=\"11\" fill=\"currentColor\" stroke=\"none\">6 cm</text><text x=\"74.4\" y=\"177\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" stroke=\"none\">8 cm</text><path d=\"M196 160L287.2 160L196 91.6Z\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><path d=\"M206 160v-10h-10\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"189\" y=\"129.8\" text-anchor=\"end\" font-size=\"11\" fill=\"currentColor\" stroke=\"none\">9 cm</text><text x=\"241.6\" y=\"177\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" stroke=\"none\">x</text></svg>"}];
const KEY = "figrev:vic-mq";
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
const save = () => localStorage.setItem(KEY, JSON.stringify(state));
const grid = document.getElementById("grid");

function card(q){
  const st = state[q.n] || {};
  const el = document.createElement("div");
  el.className = "card" + (st.flag ? " flagged" : "") + (st.ok ? " done" : "");
  el.dataset.n = q.n;
  el.dataset.hay = (q.book + " " + q.form + " " + q.stem).toLowerCase();
  el.innerHTML =
    '<div class="hd"><span class="n">' + q.n + '</span>' +
    '<span class="meta">' + q.book + (q.form ? " &middot; " + q.form : "") +
    ' &middot; ' + q.id.slice(0,8) + '</span></div>' +
    '<div class="fig">' + q.svg + '</div>' +
    '<div class="stem">' + q.stem + '</div>' +
    '<div class="opts">A ' + q.a + ' &nbsp; B ' + q.b + ' &nbsp; C ' + q.c +
    ' &nbsp; D ' + q.d + ' &nbsp; &rarr; <b>key ' + q.key + '</b></div>' +
    '<input class="note" placeholder="what is wrong with it? (optional)" value="' +
      (st.note || "").replace(/"/g,"&quot;") + '">' +
    '<div class="acts"><button data-act="flag">' +
      (st.flag ? "Un-flag" : "Flag a problem") + '</button>' +
      '<button data-act="ok">' + (st.ok ? "Un-mark" : "Looks fine") + '</button></div>';
  el.querySelector('[data-act=flag]').onclick = () => {
    state[q.n] = Object.assign({}, state[q.n], {flag: !st.flag, ok:false}); save(); draw();
  };
  el.querySelector('[data-act=ok]').onclick = () => {
    state[q.n] = Object.assign({}, state[q.n], {ok: !st.ok, flag:false}); save(); draw();
  };
  el.querySelector('.note').oninput = e => {
    state[q.n] = Object.assign({}, state[q.n], {note: e.target.value}); save();
  };
  return el;
}

function draw(){
  const mode = document.getElementById("filter").value;
  const q = document.getElementById("find").value.trim().toLowerCase();
  grid.innerHTML = "";
  let shown = 0;
  for (const it of DATA){
    const st = state[it.n] || {};
    if (mode === "todo" && (st.flag || st.ok)) continue;
    if (mode === "flagged" && !st.flag) continue;
    if (q && !((it.book + " " + it.form + " " + it.stem).toLowerCase().includes(q))) continue;
    grid.appendChild(card(it)); shown++;
  }
  const f = Object.values(state).filter(s => s.flag).length;
  const k = Object.values(state).filter(s => s.ok).length;
  document.getElementById("count").textContent =
    shown + " shown \u2022 " + f + " flagged \u2022 " + k + " marked fine \u2022 " +
    (DATA.length - f - k) + " left";
}
document.getElementById("filter").onchange = draw;
document.getElementById("find").oninput = draw;
document.getElementById("reset").onclick = () => {
  if (confirm("Clear every mark on this page?")) { state = {}; save(); draw(); }
};
document.getElementById("copy").onclick = () => {
  const lines = DATA.filter(d => (state[d.n]||{}).flag).map(d => {
    const note = (state[d.n].note || "").trim();
    return d.n + "  " + d.id.slice(0,8) + "  " + d.book +
           (d.form ? " " + d.form : "") + (note ? "  -- " + note : "");
  });
  document.getElementById("outtext").value =
    lines.length ? lines.join("\n") : "nothing flagged yet";
  document.getElementById("out").showModal();
  document.getElementById("outtext").select();
};
draw();
</script>
