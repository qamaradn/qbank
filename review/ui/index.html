<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QBank Review</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left:'$',right:'$',display:false},{left:'$$',right:'$$',display:true}]})"></script>
  <style>
    /* Design system: design-system/MASTER.md — Data-Dense Dark Dashboard */
    :root {
      --bg:          #0D1117;
      --surface:     #161B22;
      --border:      #30363D;
      --text:        #E6EDF3;
      --text-muted:  #8B949E;
      --approve:     #3FB950;
      --reject:      #F85149;
      --edit:        #58A6FF;
      --high-conf:   #3FB950;
      --mid-conf:    #E3B341;
      --low-conf:    #F85149;
      --progress:    #238636;
      --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0D1117;
      color: #E6EDF3;
      font-family: var(--sans);
      font-size: 15px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 16px;
    }
    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .header-meta {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border-radius: 6px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--sans);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.1s;
    }
    .mode-btn:hover { color: var(--text); }
    .mode-btn.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }
    .mode-btn:focus-visible { outline: 2px solid var(--edit); outline-offset: 2px; }
    .mode-count {
      font-family: var(--mono);
      font-size: 11px;
      background: rgba(139,148,158,0.15);
      color: var(--text-muted);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .mode-btn.active .mode-count {
      background: rgba(88,166,255,0.12);
      color: var(--edit);
    }
    .mode-btn#btn-approved.active .mode-count {
      background: rgba(63,185,80,0.12);
      color: var(--approve);
    }

    /* Layout */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 196px;
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 16px 12px;
    }
    .sidebar-section { margin-bottom: 24px; }
    .sidebar-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
    }
    .stat-label { font-size: 13px; color: var(--text-muted); }
    .stat-value {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .stat-value.approved { color: var(--approve); }
    .stat-value.rejected { color: var(--reject); }

    /* Subject filter */
    .subject-filter { display: flex; flex-direction: column; gap: 4px; }
    .subject-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      font-family: var(--sans);
    }
    .subject-btn:hover { border-color: var(--edit); color: var(--text); }
    .subject-btn.active {
      border-color: var(--edit);
      color: var(--edit);
      background-color: rgba(88, 166, 255, 0.08);
    }
    .subject-btn:focus-visible { outline: 2px solid var(--edit); outline-offset: 2px; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .question-area { flex: 1; overflow-y: auto; padding: 24px 32px; }

    /* Approved mode banner */
    .approved-banner {
      display: none;
      background: rgba(63,185,80,0.08);
      border-bottom: 1px solid rgba(63,185,80,0.25);
      padding: 6px 32px;
      font-size: 12px;
      color: var(--approve);
      font-family: var(--mono);
      flex-shrink: 0;
    }
    .approved-banner.visible { display: block; }

    /* Passage */
    .passage-box {
      background: #161b22;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.7;
      color: #c9d1d9;
      white-space: pre-wrap;
    }
    .passage-label {
      font-size: 10px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .passage-box table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 13px;
    }
    .passage-box th, .passage-box td {
      border: 1px solid #30363d;
      padding: 6px 12px;
      text-align: left;
    }
    .passage-box th {
      background: #21262d;
      color: var(--text);
      font-weight: 600;
    }
    .passage-box tr:nth-child(even) td { background: #1a1f27; }
    .passage-box strong { color: var(--text); }
    .passage-box em { color: #8b949e; }
    .passage-box p { margin: 0 0 10px; }
    .passage-box p:last-child { margin-bottom: 0; }

    /* Stem blocks. Stems are plain text, never markdown — many contain characters
       markdown would eat ("5x + 3 < 2x + 18", "15% of ___ = 12", "T_wc"), so they are
       set with textContent. pre-wrap keeps hand-aligned monospace columns intact. */
    .stem-text { white-space: pre-wrap; }
    .stem-text + .stem-text, .stem-table + .stem-text { margin-top: 10px; }
    .stem-table {
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
      font-family: var(--mono);
    }
    .stem-table th, .stem-table td {
      border: 1px solid #30363d;
      padding: 6px 12px;
      text-align: left;
      white-space: nowrap;
    }
    .stem-table th { background: #21262d; font-weight: 600; }
    .stem-table tr:nth-child(even) td { background: #1a1f27; }
    /* Wide tables scroll on their own rather than stretching the review pane. */
    .stem-table-wrap { overflow-x: auto; }

    /* Figure */
    .figure-container {
      margin-bottom: 20px;
      background: #ffffff;
      /* The card forces a light background, so it must also define the ink colour.
         Without this, currentColor inherits --text (#E6EDF3) and figures render
         near-white on white. */
      color: #0D1117;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px;
      display: block;
      max-width: 560px;
      box-sizing: border-box;
    }
    .figure-container svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    /* Stem */
    .question-stem {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 20px;
    }

    /* Options */
    .options { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .option-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background-color: var(--surface);
    }
    .option-row:hover { background-color: #1C2128; }
    .option-row.correct-answer {
      border-color: var(--approve);
      background-color: rgba(63, 185, 80, 0.1);
    }
    .option-letter {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 16px;
      padding-top: 1px;
    }
    .option-row.correct-answer .option-letter { color: var(--approve); }
    .option-row.wrong-answer {
      border-color: var(--reject);
      background-color: rgba(248,81,73,0.1);
    }
    .option-row.wrong-answer .option-letter { color: var(--reject); }
    .option-row.quiz-option { cursor: pointer; }
    .option-row.quiz-option:hover { border-color: var(--text-muted); }
    .option-text { font-size: 14px; color: var(--text); line-height: 1.5; }

    /* Explanation */
    .explanation {
      font-size: 13px;
      color: var(--text-muted);
      padding: 12px;
      border-left: 3px solid var(--border);
      background-color: var(--surface);
      margin-bottom: 16px;
      border-radius: 0 4px 4px 0;
    }

    /* Meta */
    .meta {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .confidence-badge { display: inline-flex; align-items: center; gap: 5px; }
    .confidence-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .confidence-dot.high { background-color: var(--high-conf); }
    .confidence-dot.mid  { background-color: var(--mid-conf); }
    .confidence-dot.low  { background-color: var(--low-conf); }

    /* Empty / loading */
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Edit mode inputs */
    .edit-stem {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background-color: var(--surface);
      border: 1px solid var(--edit);
      border-radius: 4px;
      padding: 10px;
      width: 100%;
      min-height: 80px;
      resize: vertical;
      font-family: var(--sans);
      margin-bottom: 16px;
      outline: none;
    }
    .edit-stem:focus { outline: 2px solid var(--edit); outline-offset: 2px; }
    .edit-option-input {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      width: 100%;
      outline: none;
    }
    .edit-option-input:focus { outline: 2px solid var(--edit); outline-offset: 2px; }
    .correct-answer-select {
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 13px;
      cursor: pointer;
    }
    .correct-answer-select:focus { outline: 2px solid var(--edit); outline-offset: 2px; }

    /* Action bar */
    .action-bar {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background-color: var(--surface);
      padding: 10px 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 4px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--sans);
    }
    .action-btn:hover { opacity: 0.85; }
    .action-btn:focus-visible { outline: 2px solid var(--edit); outline-offset: 2px; }
    .btn-approve { background-color: var(--approve); color: #0D1117; border-color: var(--approve); }
    .btn-reject  { background-color: var(--reject);  color: #fff;    border-color: var(--reject);  }
    .btn-edit    { background-color: transparent;     color: var(--edit); border-color: var(--edit); }
    .btn-save    { background-color: var(--approve);  color: #0D1117; }
    .btn-cancel  { background-color: transparent; color: var(--text-muted); border-color: var(--border); }
    .btn-nav {
      background-color: transparent;
      color: var(--text-muted);
      border-color: var(--border);
      padding: 7px 9px;
    }
    .btn-nav:hover { color: var(--text); border-color: var(--text-muted); }
    .action-spacer { flex: 1; }
    .kbd {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      background-color: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
    }
    .icon { width: 14px; height: 14px; flex-shrink: 0; }

    /* Writing prompt cards */
    .stimulus-box {
      background: #161b22;
      border: 1px solid var(--border);
      border-left: 3px solid #E3B341;
      border-radius: 4px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.7;
      color: #c9d1d9;
      white-space: pre-wrap;
      font-family: var(--mono);
    }
    .stimulus-label {
      font-size: 10px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #E3B341;
      margin-bottom: 8px;
    }
    .task-box {
      font-size: 16px;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 20px;
      padding: 14px 16px;
      background: rgba(88,166,255,0.06);
      border: 1px solid rgba(88,166,255,0.2);
      border-radius: 4px;
    }
    .task-label {
      font-size: 10px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--edit);
      margin-bottom: 8px;
    }
    .writing-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .writing-tag {
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .writing-tag.school { border-color: #E3B341; color: #E3B341; }
    .writing-tag.type   { border-color: var(--edit); color: var(--edit); }

    /* Progress */
    .progress-bar-wrap {
      flex-shrink: 0;
      padding: 8px 32px;
      background-color: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress {
      flex: 1;
      height: 6px;
      background-color: var(--surface);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background-color: var(--progress);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .progress-label {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 110px;
      text-align: right;
    }
  </style>
</head>
<body>

<header class="header">
  <span class="header-title">QBank Review</span>

  <!-- Mode toggle -->
  <div class="mode-toggle" role="group" aria-label="View mode">
    <button class="mode-btn active" id="btn-pending" onclick="switchMode('pending')" aria-pressed="true">
      Pending <span class="mode-count" id="mode-count-pending">—</span>
    </button>
    <button class="mode-btn" id="btn-approved" onclick="switchMode('approved')" aria-pressed="false">
      Approved <span class="mode-count" id="mode-count-approved">—</span>
    </button>
    <button class="mode-btn" id="btn-writing" onclick="switchMode('writing')" aria-pressed="false">
      Writing <span class="mode-count" id="mode-count-writing">—</span>
    </button>
  </div>

  <!-- Quiz mode toggle -->
  <button class="mode-btn" id="btn-quiz" onclick="toggleQuiz()" aria-pressed="false"
          style="border:1px solid var(--border);border-radius:6px;padding:5px 14px;">
    Quiz Mode
  </button>

  <span class="header-meta" id="header-meta"></span>
</header>

<div class="layout">

  <!-- Sidebar: stats + subject filter -->
  <nav class="sidebar" aria-label="Review sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Stats</div>
      <div class="stat-row">
        <span class="stat-label">Approved</span>
        <span class="stat-value approved" id="stat-approved">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Rejected</span>
        <span class="stat-value rejected" id="stat-rejected">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Edited</span>
        <span class="stat-value" id="stat-edited">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="stat-pending">—</span>
      </div>
    </div>

    <div class="sidebar-section" id="subject-filter-section">
      <div class="sidebar-label">Subject</div>
      <div class="subject-filter" role="group" aria-label="Filter by subject">
        <button class="subject-btn active" data-subject="" onclick="filterSubject(this,'')">All</button>
        <button class="subject-btn" data-subject="mathematics"
                onclick="filterSubject(this,'mathematics')">Mathematics</button>
        <button class="subject-btn" data-subject="quantitative_reasoning"
                onclick="filterSubject(this,'quantitative_reasoning')">Quantitative</button>
        <button class="subject-btn" data-subject="verbal_reasoning"
                onclick="filterSubject(this,'verbal_reasoning')">Verbal</button>
        <button class="subject-btn" data-subject="logical_reasoning"
                onclick="filterSubject(this,'logical_reasoning')">Logical</button>
        <button class="subject-btn" data-subject="science_reasoning"
                onclick="filterSubject(this,'science_reasoning')">Science</button>
        <button class="subject-btn" data-subject="reading_comprehension"
                onclick="filterSubject(this,'reading_comprehension')">Reading</button>
        <button class="subject-btn" data-subject="writing"
                onclick="filterSubject(this,'writing')">Writing</button>
      </div>
    </div>

    <div class="sidebar-section" id="figure-filter-section">
      <div class="sidebar-label">Diagram</div>
      <div class="subject-filter" role="group" aria-label="Filter by diagram">
        <button class="subject-btn active" data-figure="" onclick="filterFigure(this,'')">All</button>
        <button class="subject-btn" data-figure="1"
                onclick="filterFigure(this,'1')">Figures only</button>
        <button class="subject-btn" data-figure="0"
                onclick="filterFigure(this,'0')">Text only</button>
      </div>
    </div>

    <div class="sidebar-section" id="school-filter-section" style="display:none;">
      <div class="sidebar-label">School Type</div>
      <div class="subject-filter" role="group" aria-label="Filter by school type">
        <button class="subject-btn active" data-school="" onclick="filterSchool(this,'')">All</button>
        <button class="subject-btn" data-school="jmss"
                onclick="filterSchool(this,'jmss')">JMSS</button>
        <button class="subject-btn" data-school="nsw_selective"
                onclick="filterSchool(this,'nsw_selective')">NSW</button>
        <button class="subject-btn" data-school="victorian_selective"
                onclick="filterSchool(this,'victorian_selective')">Victorian</button>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="main">

    <!-- Approved mode banner -->
    <div class="approved-banner" id="approved-banner">
      Viewing approved questions — Edit (E) to modify, navigation with ←→
    </div>

    <div class="question-area" id="question-area">
      <div class="empty-state" id="empty-msg">Loading...</div>
    </div>

    <!-- Normal action bar (pending mode) -->
    <div class="action-bar" id="bar-normal">
      <button class="action-btn btn-approve" id="btn-action-approve"
              onclick="doApprove()" aria-label="Approve (A)">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/>
        </svg>
        Approve <span class="kbd">A</span>
      </button>
      <button class="action-btn btn-reject" id="btn-action-reject"
              onclick="doReject()" aria-label="Reject (R)">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/>
        </svg>
        Reject <span class="kbd">R</span>
      </button>
      <button class="action-btn btn-edit" id="btn-action-edit" onclick="enterEdit()" aria-label="Edit (E)">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M11.013 1.427a1.75 1.75 0 012.474 0l1.086 1.086a1.75 1.75 0 010 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 01-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61zm1.414 1.06a.25.25 0 00-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 000-.354l-1.086-1.086zM11.189 6.25L9.75 4.81l-6.286 6.287a.25.25 0 00-.064.108l-.558 1.953 1.953-.558a.249.249 0 00.108-.064L11.19 6.25z"/>
        </svg>
        Edit <span class="kbd">E</span>
      </button>
      <div class="action-spacer"></div>
      <button class="action-btn btn-nav" onclick="navPrev()" aria-label="Previous (Left arrow)">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M9.78 12.78a.75.75 0 01-1.06 0L4.47 8.53a.75.75 0 010-1.06l4.25-4.25a.75.75 0 011.06 1.06L6.06 8l3.72 3.72a.75.75 0 010 1.06z"/>
        </svg>
      </button>
      <span class="kbd" style="font-family:var(--mono);font-size:11px;color:var(--text-muted);" id="queue-pos"></span>
      <button class="action-btn btn-nav" onclick="navNext()" aria-label="Next (Right arrow)">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M6.22 3.22a.75.75 0 011.06 0l4.25 4.25a.75.75 0 010 1.06l-4.25 4.25a.75.75 0 01-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 010-1.06z"/>
        </svg>
      </button>
    </div>

    <!-- Edit action bar -->
    <div class="action-bar" id="bar-edit" style="display:none;">
      <button class="action-btn btn-save" onclick="saveEdit()" aria-label="Save (Enter)">
        Save <span class="kbd">Enter</span>
      </button>
      <button class="action-btn btn-cancel" onclick="cancelEdit()" aria-label="Cancel (Escape)">
        Cancel <span class="kbd">Esc</span>
      </button>
      <div class="action-spacer"></div>
      <span style="font-size:12px;color:var(--text-muted);">Tab between fields to edit</span>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar-wrap">
      <div class="progress" id="progress-bar-container"
           role="progressbar" aria-label="Review progress"
           aria-valuenow="0" aria-valuemin="0" aria-valuemax="0">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-label" id="progress-label">0 / 0 reviewed</span>
    </div>

  </div><!-- /.main -->
</div><!-- /.layout -->

<script>
  const API = '';

  // ── State ─────────────────────────────────────────────────────────────────────
  let queue        = [];
  let currentIndex = 0;
  let editMode     = false;
  let originalValues = {};
  let activeSubject  = '';
  let activeFigure   = '';   // '' = all, '1' = figures only, '0' = text only
  let activeSchool   = '';
  let activeMode     = 'pending'; // 'pending' | 'approved' | 'writing'
  let quizMode       = false;

  // ── Init ──────────────────────────────────────────────────────────────────────
  async function init() {
    await loadQueue();
    await loadStats();
  }

  // ── Mode toggle ───────────────────────────────────────────────────────────────
  function switchMode(mode) {
    if (activeMode === mode) return;
    activeMode = mode;

    ['pending','approved','writing'].forEach(m => {
      document.getElementById('btn-' + m).classList.toggle('active', m === mode);
      document.getElementById('btn-' + m).setAttribute('aria-pressed', m === mode);
    });

    const banner = document.getElementById('approved-banner');
    banner.classList.toggle('visible', mode === 'approved');

    const isWriting = mode === 'writing';
    document.getElementById('subject-filter-section').style.display = isWriting ? 'none' : '';
    document.getElementById('school-filter-section').style.display  = isWriting ? ''     : 'none';

    // Show/hide Approve + Reject (always visible in writing mode for A/R)
    const showReview = (mode === 'pending' || mode === 'writing') && !quizMode;
    document.getElementById('btn-action-approve').style.display = showReview ? '' : 'none';
    document.getElementById('btn-action-reject').style.display  = showReview ? '' : 'none';
    document.getElementById('btn-action-edit').style.display    = isWriting  ? 'none' : '';

    if (editMode) cancelEdit();
    loadQueue();
    loadStats();
  }

  // ── Quiz mode ─────────────────────────────────────────────────────────────────
  function toggleQuiz() {
    quizMode = !quizMode;
    const btn = document.getElementById('btn-quiz');
    btn.setAttribute('aria-pressed', quizMode);
    btn.style.color           = quizMode ? 'var(--edit)' : '';
    btn.style.borderColor     = quizMode ? 'var(--edit)' : 'var(--border)';
    btn.style.backgroundColor = quizMode ? 'rgba(88,166,255,0.08)' : '';

    const showReview = !quizMode && activeMode === 'pending';
    document.getElementById('btn-action-approve').style.display = showReview ? '' : 'none';
    document.getElementById('btn-action-reject').style.display  = showReview ? '' : 'none';
    document.getElementById('btn-action-edit').style.display    = quizMode   ? 'none' : '';

    if (queue.length) render();
  }

  function revealQuizAnswer(selected, correct, opts) {
    if (opts.dataset.answered) return;
    opts.dataset.answered = '1';
    opts.querySelectorAll('.quiz-option').forEach(row => {
      row.style.cursor = 'default';
      const lt = row.dataset.letter;
      if (lt === correct) row.classList.add('correct-answer');
      else if (lt === selected) row.classList.add('wrong-answer');
    });
    const exp = document.getElementById('quiz-explanation');
    if (exp) exp.style.display = '';
  }

  // ── Queue / render ────────────────────────────────────────────────────────────
  async function loadQueue() {
    try {
      let res;
      if (activeMode === 'writing') {
        const params = new URLSearchParams({ status: 'pending' });
        if (activeSchool) params.set('school_type', activeSchool);
        res = await fetch(`${API}/writing-prompts?${params}`);
      } else {
        const params = new URLSearchParams({ status: activeMode });
        if (activeSubject) params.set('subject', activeSubject);
        if (activeFigure) params.set('has_figure', activeFigure === '1' ? 'true' : 'false');
        res = await fetch(`${API}/questions?${params}`);
      }
      if (!res.ok) throw new Error(res.statusText);
      queue = await res.json();
      currentIndex = 0;
      render();
    } catch (e) {
      showEmpty('Could not load: ' + e.message);
    }
  }

  function render() {
    if (!queue.length) {
      const msgs = { pending: 'No pending questions', approved: 'No approved questions', writing: 'No pending writing prompts' };
      showEmpty(msgs[activeMode] || 'Nothing to show');
      return;
    }
    if (activeMode === 'writing') {
      renderWritingPrompt(queue[currentIndex]);
    } else {
      renderQuestion(queue[currentIndex]);
    }
    document.getElementById('queue-pos').textContent =
      `${currentIndex + 1} / ${queue.length}`;
  }

  function renderWritingPrompt(p) {
    const area = document.getElementById('question-area');
    area.innerHTML = '';

    // Tags row
    const tags = document.createElement('div');
    tags.className = 'writing-tags';
    const schoolLabel = (p.school_type || '').replace(/_/g, ' ');
    const typeLabel   = (p.prompt_type || '').replace(/_/g, ' ');
    const stimLabel   = (p.stimulus_type || '').replace(/_/g, ' ');
    tags.innerHTML =
      `<span class="writing-tag school">${esc(schoolLabel)}</span>` +
      `<span class="writing-tag type">${esc(typeLabel)}</span>` +
      `<span class="writing-tag">${esc(stimLabel)}</span>` +
      `<span class="writing-tag">${esc(p.difficulty || '')}</span>`;
    area.appendChild(tags);

    // Stimulus
    if (p.stimulus_content) {
      const slabel = document.createElement('div');
      slabel.className = 'stimulus-label';
      slabel.textContent = 'Stimulus';
      const sbox = document.createElement('div');
      sbox.className = 'stimulus-box';
      sbox.textContent = p.stimulus_content;
      area.appendChild(slabel);
      area.appendChild(sbox);
    }

    // Task instruction
    const tlabel = document.createElement('div');
    tlabel.className = 'task-label';
    tlabel.textContent = 'Writing Task';
    const tbox = document.createElement('div');
    tbox.className = 'task-box';
    tbox.textContent = p.task_instruction || '';
    area.appendChild(tlabel);
    area.appendChild(tbox);

    // Meta
    let mf = [];
    try { mf = JSON.parse(p.marking_focus || '[]'); } catch(_) {}
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML =
      `<span>${esc(p.topic || '')}</span>` +
      `<span>${p.word_count_min}–${p.word_count_max} words</span>` +
      `<span>${p.time_limit_minutes} min</span>` +
      (mf.length ? `<span>Focus: ${mf.map(esc).join(' · ')}</span>` : '');
    area.appendChild(meta);
  }

  // Stems are plain text, not markdown, and are set with textContent so that
  // "5x + 3 < 2x + 18" or "15% of ___ = 12" survive verbatim. The one exception is a
  // pipe table (price lists, frequency tables), which is rebuilt as a real <table> —
  // as plain text its newlines collapse and the columns become an unreadable run-on line.
  function isTableRow(line) {
    return line.trim().startsWith('|');
  }

  // A markdown alignment row, e.g. |----|:---:|, carries no data.
  function isTableDivider(line) {
    return /^\|[\s:|-]+\|?$/.test(line.trim()) && line.includes('-');
  }

  function splitTableRow(line) {
    const t = line.trim();
    return t.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  }

  function buildStemTable(lines) {
    const rows = lines.filter(l => !isTableDivider(l)).map(splitTableRow);
    const hasHeader = lines.some(isTableDivider);
    const wrap = document.createElement('div');
    wrap.className = 'stem-table-wrap';
    const table = document.createElement('table');
    table.className = 'stem-table';
    rows.forEach((cells, i) => {
      const tr = document.createElement('tr');
      cells.forEach(cell => {
        const td = document.createElement(hasHeader && i === 0 ? 'th' : 'td');
        td.textContent = cell;
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    return wrap;
  }

  function renderStem(container, text) {
    const lines = String(text).split('\n');
    let buf = [], bufIsTable = false;

    const flush = () => {
      if (!buf.length) return;
      if (bufIsTable) {
        container.appendChild(buildStemTable(buf));
      } else {
        const div = document.createElement('div');
        div.className = 'stem-text';
        div.textContent = buf.join('\n').replace(/^\n+|\n+$/g, '');
        if (div.textContent) container.appendChild(div);
      }
      buf = [];
    };

    for (const line of lines) {
      const t = isTableRow(line);
      if (t !== bufIsTable) { flush(); bufIsTable = t; }
      buf.push(line);
    }
    flush();
  }

  function renderQuestion(q) {
    const area = document.getElementById('question-area');
    area.innerHTML = '';

    // Figure — inline SVG
    if (q.figure_svg) {
      const fig = document.createElement('div');
      fig.className = 'figure-container';
      // Inject viewBox if missing so width:100% scales correctly
      let svg = q.figure_svg;
      if (!svg.includes('viewBox')) {
        const w = (svg.match(/width=['"](\d+)['"]/) || [])[1];
        const h = (svg.match(/height=['"](\d+)['"]/) || [])[1];
        if (w && h) svg = svg.replace('<svg ', `<svg viewBox="0 0 ${w} ${h}" `);
      }
      fig.innerHTML = svg;
      area.appendChild(fig);
    }

    // Passage (science reasoning / reading comprehension)
    if (q.passage) {
      const label = document.createElement('div');
      label.className = 'passage-label';
      label.textContent = 'Passage';
      const box = document.createElement('div');
      box.className = 'passage-box';
      box.innerHTML = marked.parse(q.passage);
      area.appendChild(label);
      area.appendChild(box);
    }

    // Stem
    const stem = document.createElement('div');
    stem.className = 'question-stem';
    renderStem(stem, q.stem || q.writing_prompt || '');
    area.appendChild(stem);

    // Options (MCQ)
    if (q.correct_answer) {
      const opts = document.createElement('div');
      opts.className = 'options';
      for (const [lt, key] of [['A','option_a'],['B','option_b'],['C','option_c'],['D','option_d']]) {
        if (!q[key]) continue;
        const row = document.createElement('div');
        if (quizMode) {
          row.className = 'option-row quiz-option';
          row.dataset.letter = lt;
          row.addEventListener('click', function() {
            revealQuizAnswer(lt, q.correct_answer, opts);
          });
        } else {
          row.className = 'option-row' + (lt === q.correct_answer ? ' correct-answer' : '');
        }
        const lspan = document.createElement('span');
        lspan.className = 'option-letter';
        lspan.textContent = lt;
        const tspan = document.createElement('span');
        tspan.className = 'option-text';
        tspan.textContent = q[key];
        row.appendChild(lspan);
        row.appendChild(tspan);
        opts.appendChild(row);
      }
      area.appendChild(opts);
    }

    // Explanation
    if (q.explanation) {
      const exp = document.createElement('div');
      exp.className = 'explanation';
      exp.id = 'quiz-explanation';
      exp.textContent = q.explanation;
      if (quizMode) exp.style.display = 'none';
      area.appendChild(exp);
    }

    // Meta (monospace data elements)
    const conf = typeof q.confidence === 'number' ? q.confidence : 0;
    const confClass = conf >= 0.90 ? 'high' : conf >= 0.70 ? 'mid' : 'low';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML =
      `<span class="confidence-badge">` +
        `<span class="confidence-dot ${confClass}"></span>` +
        `${(conf * 100).toFixed(0)}% confidence` +
      `</span>` +
      `<span>${esc(q.source_book || '')} p.${q.source_page ?? '—'}</span>` +
      // curriculum-authored books tag each row "Subtopic <Ref> — <title>"; show the
      // subtopic so coverage is visible while reviewing. Gemini-generated books put a
      // page description here instead, which is not worth a meta chip.
      (/^Subtopic /.test(q.source_page_description || '')
        ? `<span>${esc(q.source_page_description.replace(/^Subtopic /, ''))}</span>` : '') +
      `<span>${(q.subject || '').replace(/_/g, ' ')}</span>` +
      (q.edited ? `<span style="color:var(--edit);">edited</span>` : '');
    area.appendChild(meta);

    // Re-render LaTeX after DOM update
    if (window.renderMathInElement) {
      renderMathInElement(area, {
        delimiters: [
          {left: '$', right: '$', display: false},
          {left: '$$', right: '$$', display: true}
        ],
        throwOnError: false
      });
    }
  }

  function showEmpty(msg) {
    const area = document.getElementById('question-area');
    area.innerHTML = `<div class="empty-state">${esc(msg)}</div>`;
    document.getElementById('queue-pos').textContent = '';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Stats ─────────────────────────────────────────────────────────────────────
  async function loadStats() {
    try {
      if (activeMode === 'writing') {
        const res = await fetch(`${API}/stats/writing`);
        if (!res.ok) return;
        const d = await res.json();
        document.getElementById('stat-approved').textContent = d.approved ?? 0;
        document.getElementById('stat-rejected').textContent = d.rejected ?? 0;
        document.getElementById('stat-edited').textContent   = '—';
        document.getElementById('stat-pending').textContent  = d.pending  ?? 0;
        document.getElementById('header-meta').textContent   = `${d.pending ?? 0} writing pending`;
        document.getElementById('mode-count-writing').textContent = d.pending ?? 0;
        const reviewed = (d.approved ?? 0) + (d.rejected ?? 0);
        const total    = d.total ?? 0;
        const pct      = total > 0 ? (reviewed / total * 100) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-label').textContent = `${reviewed} / ${total} reviewed`;
        const pb = document.getElementById('progress-bar-container');
        pb.setAttribute('aria-valuenow', reviewed);
        pb.setAttribute('aria-valuemax', total);
      } else {
        const res = await fetch(`${API}/stats`);
        if (!res.ok) return;
        const d = await res.json();
        document.getElementById('stat-approved').textContent = d.approved ?? 0;
        document.getElementById('stat-rejected').textContent = d.rejected ?? 0;
        document.getElementById('stat-edited').textContent   = d.edited   ?? 0;
        document.getElementById('stat-pending').textContent  = d.pending  ?? 0;
        document.getElementById('header-meta').textContent   = `${d.pending ?? 0} pending`;
        document.getElementById('mode-count-pending').textContent  = d.pending  ?? 0;
        document.getElementById('mode-count-approved').textContent = d.approved ?? 0;
        const reviewed = (d.approved ?? 0) + (d.rejected ?? 0);
        const total    = d.total ?? 0;
        const pct      = total > 0 ? (reviewed / total * 100) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-label').textContent = `${reviewed} / ${total} reviewed`;
        const pb = document.getElementById('progress-bar-container');
        pb.setAttribute('aria-valuenow', reviewed);
        pb.setAttribute('aria-valuemax', total);
      }
    } catch (_) {}
  }

  // ── Actions ───────────────────────────────────────────────────────────────────
  async function doApprove() {
    if (editMode || !queue.length) return;
    if (activeMode !== 'pending' && activeMode !== 'writing') return;
    const q = queue[currentIndex];
    const url = activeMode === 'writing'
      ? `${API}/writing-prompts/${q.id}/approve`
      : `${API}/questions/${q.id}/approve`;
    await fetch(url, { method: 'POST' });
    queue.splice(currentIndex, 1);
    if (currentIndex >= queue.length) currentIndex = Math.max(0, queue.length - 1);
    render();
    await loadStats();
  }

  async function doReject() {
    if (editMode || !queue.length) return;
    if (activeMode !== 'pending' && activeMode !== 'writing') return;
    const q = queue[currentIndex];
    const url = activeMode === 'writing'
      ? `${API}/writing-prompts/${q.id}/reject`
      : `${API}/questions/${q.id}/reject`;
    await fetch(url, { method: 'POST' });
    queue.splice(currentIndex, 1);
    if (currentIndex >= queue.length) currentIndex = Math.max(0, queue.length - 1);
    render();
    await loadStats();
  }

  function navPrev() {
    if (editMode || !queue.length) return;
    if (currentIndex > 0) { currentIndex--; render(); }
  }

  function navNext() {
    if (editMode || !queue.length) return;
    if (currentIndex < queue.length - 1) { currentIndex++; render(); }
  }

  // ── Edit mode ─────────────────────────────────────────────────────────────────
  function enterEdit() {
    if (!queue.length) return;
    const q = queue[currentIndex];
    editMode = true;

    originalValues = {
      stem:           q.stem,
      option_a:       q.option_a,
      option_b:       q.option_b,
      option_c:       q.option_c,
      option_d:       q.option_d,
      correct_answer: q.correct_answer,
    };

    const area = document.getElementById('question-area');
    area.innerHTML = '';

    const ta = document.createElement('textarea');
    ta.className = 'edit-stem';
    ta.id = 'edit-stem';
    ta.value = q.stem || '';
    area.appendChild(ta);

    for (const [lt, key] of [['A','option_a'],['B','option_b'],['C','option_c'],['D','option_d']]) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px;';
      const lbl = document.createElement('span');
      lbl.textContent = lt;
      lbl.style.cssText = 'font-family:var(--mono);font-size:12px;color:var(--text-muted);min-width:14px;';
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'edit-option-input';
      inp.id = `edit-${key}`;
      inp.value = q[key] || '';
      row.appendChild(lbl);
      row.appendChild(inp);
      area.appendChild(row);
    }

    const selRow = document.createElement('div');
    selRow.style.cssText = 'display:flex;align-items:center;gap:10px;margin-top:12px;';
    const selLbl = document.createElement('span');
    selLbl.textContent = 'Correct answer:';
    selLbl.style.cssText = 'font-size:13px;color:var(--text-muted);';
    const sel = document.createElement('select');
    sel.className = 'correct-answer-select';
    sel.id = 'edit-correct';
    for (const lt of ['A','B','C','D']) {
      const opt = document.createElement('option');
      opt.value = lt; opt.textContent = lt;
      if (lt === q.correct_answer) opt.selected = true;
      sel.appendChild(opt);
    }
    selRow.appendChild(selLbl);
    selRow.appendChild(sel);
    area.appendChild(selRow);

    document.getElementById('bar-normal').style.display = 'none';
    document.getElementById('bar-edit').style.display   = 'flex';
    ta.focus();
  }

  async function saveEdit() {
    if (!editMode || !queue.length) return;
    const q = queue[currentIndex];
    const payload = {
      stem:           document.getElementById('edit-stem').value,
      option_a:       document.getElementById('edit-option_a').value,
      option_b:       document.getElementById('edit-option_b').value,
      option_c:       document.getElementById('edit-option_c').value,
      option_d:       document.getElementById('edit-option_d').value,
      correct_answer: document.getElementById('edit-correct').value,
    };
    const res = await fetch(`${API}/questions/${q.id}/edit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) { console.error('Edit failed', await res.text()); return; }

    if (activeMode === 'approved') {
      // Stay on this question — update in-memory and re-render
      Object.assign(q, payload, { edited: true, review_status: 'approved' });
      exitEdit();
      render();
    } else {
      // Pending mode — question moves to approved, remove from queue
      queue.splice(currentIndex, 1);
      if (currentIndex >= queue.length) currentIndex = Math.max(0, queue.length - 1);
      exitEdit();
      render();
    }
    await loadStats();
  }

  function cancelEdit() {
    if (!editMode || !queue.length) return;
    Object.assign(queue[currentIndex], originalValues);
    exitEdit();
    render();
  }

  function exitEdit() {
    editMode       = false;
    originalValues = {};
    document.getElementById('bar-normal').style.display = 'flex';
    document.getElementById('bar-edit').style.display   = 'none';
  }

  // ── Subject filter ────────────────────────────────────────────────────────────
  function filterSubject(btn, subject) {
    document.querySelectorAll('#subject-filter-section .subject-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSubject = subject;
    loadQueue();
  }

  function filterFigure(btn, figure) {
    document.querySelectorAll('#figure-filter-section .subject-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFigure = figure;
    loadQueue();
  }

  function filterSchool(btn, school) {
    document.querySelectorAll('#school-filter-section .subject-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSchool = school;
    loadQueue();
  }

  // ── Keyboard ──────────────────────────────────────────────────────────────────
  document.addEventListener('keydown', function(e) {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select';

    if (editMode) {
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
      if (e.key === 'Enter' && !typing) { e.preventDefault(); saveEdit(); }
      return;
    }

    if (typing) return;

    if (!quizMode) {
      if (e.key === 'a' || e.key === 'A') doApprove();
      if (e.key === 'r' || e.key === 'R') doReject();
      if ((e.key === 'e' || e.key === 'E') && activeMode !== 'writing') enterEdit();
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); navNext(); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); navPrev(); }
  });

  // ── Start ─────────────────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
